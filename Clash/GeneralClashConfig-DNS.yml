# Mihomo base config for unified DIRECT DNS resolution
mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: "*"
ipv6: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  listen: 0.0.0.0:1053
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  ipv6: false
  default-nameserver:
    - 223.5.5.5
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
  nameserver-policy:
    # Scoped DoH through the Claude group; other DNS settings stay unchanged.
    "+.anthropic.com":
      - "https://1.1.1.1/dns-query#Claude 专属"
      - "https://8.8.8.8/dns-query#Claude 专属"
    "+.claude.ai":
      - "https://1.1.1.1/dns-query#Claude 专属"
      - "https://8.8.8.8/dns-query#Claude 专属"
    "+.claude.com":
      - "https://1.1.1.1/dns-query#Claude 专属"
      - "https://8.8.8.8/dns-query#Claude 专属"
    "+.claudeusercontent.com":
      - "https://1.1.1.1/dns-query#Claude 专属"
      - "https://8.8.8.8/dns-query#Claude 专属"
    # Diagnostic domains only; this test does not prove all DNS is protected.
    "+.d.ip.net.coffee":
      - "https://1.1.1.1/dns-query#Claude 专属"
      - "https://8.8.8.8/dns-query#Claude 专属"
    www.baidu.com: 114.114.114.114
    "+.internal.crop.com": 10.0.0.1
    "geosite:cn": https://doh.pub/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - system://
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  direct-nameserver:
    - system://
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"

proxies: []
proxy-groups: []
rules: []
